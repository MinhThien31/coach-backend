name: Deploy Spring Boot to Pi

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare Jar
        run: |
          mkdir -p target/deploy
          mv target/*.jar target/deploy/spring-app.jar

      - name: Copy JAR to Pi
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 2222
          use_insecure_cipher: true
          source: "target/deploy/spring-app.jar"
          target: "/home/minhthien/app"
          strip_components: 2

      - name: Restart with PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USERNAME }}
          key: ${{ secrets.PI_SSH_KEY }}
          port: 2222
          family: inet
          script: |
            pm2 delete spring-app || true
            pm2 start "java -Xmx768M -jar /home/minhthien/app/spring-app.jar" --name "spring-app"
            pm2 save