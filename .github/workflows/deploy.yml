name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - main # Chạy tự động mỗi khi có code mới đẩy lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'corretto'
        java-version: '17' # Đổi thành 8, 11 hoặc 21 nếu dự án của bạn dùng bản khác

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Rename JAR file
      run: mv target/*.jar target/app.jar # Đổi tên cho đồng nhất với cấu hình EC2

    - name: Copy JAR to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/app.jar"
        target: "/home/ubuntu/"
        strip_components: 1

    - name: Restart Backend Service
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo systemctl restart coach-backend.service
