name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare Jar
        run: |
          mkdir -p target/deploy
          mv target/*.jar target/deploy/app.jar

      - name: Check SSH reachability
        run: |
          SSH_PORT="${{ secrets.EC2_SSH_PORT }}"
          if [ -z "$SSH_PORT" ]; then SSH_PORT="22"; fi
          if ! timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.EC2_HOST }}/$SSH_PORT"; then
            echo "Cannot reach EC2 SSH port $SSH_PORT from GitHub Actions."
            echo "Check EC2_HOST, EC2_SSH_PORT, EC2 security group inbound rules, subnet/NACL, and whether sshd is running."
            exit 1
          fi

      - name: Deploy to AWS EC2 via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          source: "target/deploy/app.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/"
          strip_components: 2

      - name: Restart Systemd Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            # Đảm bảo file có quyền thực thi và đúng sở hữu
            sudo chown ${{ secrets.EC2_USERNAME }}:${{ secrets.EC2_USERNAME }} /home/${{ secrets.EC2_USERNAME }}/app.jar

            # Khởi động lại service
            sudo systemctl restart coach-backend.service

            # Kiểm tra nhanh trạng thái
            echo "Current status:"
            sudo systemctl status coach-backend.service | grep Active
