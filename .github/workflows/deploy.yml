name: Deploy Spring Boot to Pi

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Prepare Jar
        run: |
          mkdir -p target/deploy
          mv target/*.jar target/deploy/spring-app.jar

      - name: Install Cloudflare Client
        run: |
          sudo mkdir -p --mode=0755 /usr/local/bin
          curl -L --output /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      - name: Deploy to Pi via Tunnel
        env:
          SSH_KEY: ${{ secrets.PI_SSH_KEY }}
          PI_USER: ${{ secrets.PI_USERNAME }}
          PI_HOST: ssh.minhthien.io.vn
        run: |
          # 1. Thiết lập thư mục SSH và lưu Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Tạo file cấu hình SSH để "ép" chui qua cloudflared
          cat <<EOF > ~/.ssh/config
          Host my-pi
            HostName $PI_HOST
            User $PI_USER
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

          # 3. Copy file JAR (Dùng SCP qua Tunnel)
          scp target/deploy/spring-app.jar my-pi:/home/minhthien/app/spring-app.jar

          # 4. Restart App bằng PM2 (Dùng SSH qua Tunnel)
          ssh my-pi "pm2 delete spring-app || true && pm2 start 'java -Xmx768M -jar /home/minhthien/app/spring-app.jar' --name 'spring-app' && pm2 save"