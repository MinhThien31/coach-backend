name: Java CI/CD with Spring Boot

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Copy JAR to Raspberry Pi
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USERNAME }}
        key: ${{ secrets.PI_SSH_KEY }}
        source: "target/*.jar"
        target: "/home/minhthien/app"
        strip_components: 1

    - name: Restart Spring Boot App
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PI_HOST }}
        username: ${{ secrets.PI_USERNAME }}
        key: ${{ secrets.PI_SSH_KEY }}
        script: |
          # Tìm và tắt app cũ đang chạy, sau đó chạy app mới
          pgrep -f 'java -jar' | xargs -r kill -9
          nohup java -Xmx512M -jar /home/minhthien/app/*.jar > /home/minhthien/app/app.log 2>&1 &
